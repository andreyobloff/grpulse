name: Build and Test GreenPulse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check project files
        run: |
          test -f README.md
          test -f src/greenpulse_app.py
          test -f src/models.py
          test -f src/services.py
          test -f tests/test_greenpulse.py

      - name: Run application
        run: python -m src.greenpulse_app

      - name: Run tests
        run: python tests/test_greenpulse.py
