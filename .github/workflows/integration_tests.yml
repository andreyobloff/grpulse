name: GreenPulse Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check integration files
        run: |
          test -f src/integrations.py
          test -f tests/test_integrations.py

      - name: Run integration tests
        run: PYTHONPATH=. python -m tests.test_integrations
