name: GreenPulse API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check API files
        run: |
          test -f src/api.py
          test -f tests/test_api.py

      - name: Run API tests
        run: PYTHONPATH=. python -m tests.test_api
