name: GreenPulse Security Measures Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-measures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check security files
        run: |
          test -f src/security.py
          test -f tests/test_security.py

      - name: Run security tests
        run: PYTHONPATH=. python -m tests.test_security
